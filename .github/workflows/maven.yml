# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # MySQL is required by the Spring context test (see src/main/resources/application.properties)
    services:
      mysql:
        image: mysql:9.4.0
        env:
          MYSQL_ROOT_PASSWORD: 53cret
          MYSQL_DATABASE: jwt_auth_db
          MYSQL_USER: yu71
          MYSQL_PASSWORD: 53cret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u yu71 -p53cret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: ./mvnw -B verify --file pom.xml
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: surefire-reports
        path: target/surefire-reports/
        retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: springboot-jwt-auth:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    needs: build
    # Submitting the dependency graph needs write access, which is not granted to PRs from forks / Dependabot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
